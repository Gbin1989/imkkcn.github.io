<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Kudog 电视直播</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0f1e;
            font-family: 'Segoe UI', 'Roboto', system-ui, sans-serif;
            color: #eef2ff;
            padding: 20px 24px 40px;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .header {
            text-align: center;
            margin-bottom: 28px;
        }
        .header h1 {
            font-size: 2.2rem;
            font-weight: 600;
            background: linear-gradient(135deg, #FFFFFF, #86b6ff);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }
        .header p {
            color: #9aa4bf;
            margin-top: 8px;
            font-size: 0.9rem;
        }

        .player-section {
            background: #000000;
            border-radius: 28px;
            overflow: hidden;
            box-shadow: 0 20px 35px -12px rgba(0,0,0,0.5);
            margin-bottom: 32px;
        }
        .video-wrapper {
            position: relative;
            width: 100%;
            background: #000;
            aspect-ratio: 16 / 9;
        }
        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            display: block;
        }
        .player-info {
            background: rgba(10, 15, 30, 0.85);
            backdrop-filter: blur(10px);
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }
        .current-channel {
            font-weight: 600;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .current-channel .tag {
            background: #e11d48;
            padding: 4px 10px;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            color: white;
        }
        .live-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            background: rgba(225, 29, 72, 0.2);
            padding: 4px 12px;
            border-radius: 60px;
            font-size: 0.75rem;
            color: #ff9fae;
        }
        .live-badge::before {
            content: "";
            width: 8px;
            height: 8px;
            background: #e11d48;
            border-radius: 50%;
            animation: pulse 1.2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 0.4; transform: scale(0.8);}
            100% { opacity: 1; transform: scale(1.2);}
        }

        .tabs {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 28px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            padding-bottom: 12px;
        }
        .tab-btn {
            background: transparent;
            border: none;
            padding: 8px 24px;
            font-size: 1rem;
            font-weight: 500;
            color: #b9c3e6;
            cursor: pointer;
            border-radius: 40px;
            transition: 0.2s;
            font-family: inherit;
        }
        .tab-btn.active {
            background: #2d3a5e;
            color: white;
        }
        .tab-btn:hover:not(.active) {
            background: #1f2a44;
            color: #eef2ff;
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(110px, 130px));
            gap: 14px;
            justify-content: start;
            max-height: 520px;
            overflow-y: auto;
            padding: 8px 4px 20px 4px;
        }
        .channels-grid::-webkit-scrollbar {
            width: 5px;
        }
        .channels-grid::-webkit-scrollbar-track {
            background: #141b2b;
            border-radius: 10px;
        }
        .channels-grid::-webkit-scrollbar-thumb {
            background: #3e4a6b;
            border-radius: 10px;
        }

        .channel-card {
            background: #111827;
            border-radius: 20px;
            padding: 12px 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid rgba(255,255,255,0.05);
        }
        .channel-card:hover {
            background: #1f2a48;
            transform: translateY(-3px);
        }
        .channel-card.active-channel {
            background: linear-gradient(145deg, #1e2b4a, #14203a);
            border-left: 3px solid #3b82f6;
        }
        .channel-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow-x: hidden;
            text-overflow: ellipsis;
        }
        .channel-type {
            font-size: 0.65rem;
            color: #7d8fb3;
            margin-top: 6px;
            background: #1e2a3a;
            display: inline-block;
            padding: 2px 8px;
            border-radius: 20px;
        }

        .loading-toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            color: white;
            padding: 8px 22px;
            border-radius: 40px;
            font-size: 0.85rem;
            pointer-events: none;
            z-index: 1000;
            transition: opacity 0.2s;
            border: 1px solid rgba(255,255,255,0.2);
        }
        .empty-tip {
            text-align: center;
            padding: 40px;
            color: #6c7a9e;
        }
        footer {
            text-align: center;
            margin-top: 32px;
            font-size: 0.7rem;
            color: #4a5679;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 20px;
        }
        @media (max-width: 720px) {
            body { padding: 16px 12px 30px; }
            .channels-grid { grid-template-columns: repeat(auto-fill, minmax(95px, 105px)); gap: 10px; }
            .channel-name { font-size: 0.75rem; }
            .tab-btn { padding: 6px 18px; font-size: 0.85rem; }
        }
    </style>
</head>
<body>

        { name: "山东卫视", type: "satellite", url: "bcian.cn/ysp?id=sdws" },

        { name: "陕西卫视", type: "satellite", url: "bcian.cn/ysp?id=shanxiws" },

        { name: "内蒙古卫视", type: "satellite", url: "bcian.cn/ysp?id=nmgws" },
        { name: "云南卫视", type: "satellite", url: "bcian.cn/ysp?id=ynws" },
        { name: "山西卫视", type: "satellite", url: "bcian.cn/ysp?id=shanxiws2" },
        { name: "青海卫视", type: "satellite", url: "bcian.cn/ysp?id=qhws" },
        { name: "西藏卫视", type: "satellite", url: "bcian.cn/ysp?id=xzws" },
        { name: "中国教育电视台1频道", type: "satellite", url: "bcian.cn/ysp?id=cetv1" },
        { name: "国学频道", type: "satellite", url: "bcian.cn/ysp?id=gxpd" },
        { name: "新疆卫视", type: "satellite", url: "bcian.cn/ysp?id=xjws" }
    ];

    // 去重 (以频道名为准)
    const uniqueMap = new Map();
    for (const ch of rawChannels) {
        if (!uniqueMap.has(ch.name)) uniqueMap.set(ch.name, ch);
    }
    const allChannels = Array.from(uniqueMap.values());
    const cctvChannels = allChannels.filter(ch => ch.type === 'cctv');
    const satelliteChannels = allChannels.filter(ch => ch.type === 'satellite');

    const videoPlayer = document.getElementById('liveVideo');
    const currentChannelNameSpan = document.getElementById('currentChannelName');
    const channelsContainer = document.getElementById('channelsContainer');
    const loadingToast = document.getElementById('loadingToast');
    let activeCategory = 'cctv';
    let currentChannel = null;
    let toastTimeout = null;

    function showLoadingToast(msg, autoHide = true) {
        if (loadingToast) {
            loadingToast.innerText = msg;
            loadingToast.style.opacity = '1';
            if (toastTimeout) clearTimeout(toastTimeout);
            if (autoHide) toastTimeout = setTimeout(() => { if (loadingToast) loadingToast.style.opacity = '0'; }, 1800);
        }
    }
    function hideLoadingToast() { if (loadingToast) loadingToast.style.opacity = '0'; if (toastTimeout) clearTimeout(toastTimeout); }

    // 拼接完整的视频链接 (根据实际部署情况，可能需要补全协议，这里默认自动补 https://)
    function getFullUrl(baseUrl) {
        if (baseUrl.startsWith('http://') || baseUrl.startsWith('https://')) {
            return baseUrl;
        }
        // 如果链接类似 bcian.cn/... 则自动补全 https://
        return 'https://' + baseUrl;
    }

    function switchChannel(channel) {
        if (!channel || !channel.url) return;
        if (currentChannel && currentChannel.name === channel.name && videoPlayer.src === getFullUrl(channel.url)) return;
        showLoadingToast(`加载 ${channel.name} ...`);
        currentChannel = channel;
        currentChannelNameSpan.innerText = channel.name;
        videoPlayer.pause();
        videoPlayer.src = '';
        const fullUrl = getFullUrl(channel.url);
        videoPlayer.src = fullUrl;
        videoPlayer.load();
        videoPlayer.play().catch(e => {
            console.warn("自动播放被阻止或源不可用:", e);
            showLoadingToast(`点击播放器播放 ${channel.name}`, true);
        });
        renderChannelsList();
        videoPlayer.onerror = () => showLoadingToast(`频道 ${channel.name} 源失效`, true);
        videoPlayer.oncanplay = () => hideLoadingToast();
    }

    function renderChannelsList() {
        const channelsList = activeCategory === 'cctv' ? cctvChannels : satelliteChannels;
        if (!channelsContainer) return;
        if (channelsList.length === 0) {
            channelsContainer.innerHTML = '<div class="empty-tip">✨ 暂无频道数据</div>';
            return;
        }
        const fragment = document.createDocumentFragment();
        channelsList.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            if (currentChannel && currentChannel.name === ch.name) card.classList.add('active-channel');
            const nameSpan = document.createElement('div');
            nameSpan.className = 'channel-name';
            nameSpan.innerText = ch.name;
            const typeSpan = document.createElement('div');
            typeSpan.className = 'channel-type';
            typeSpan.innerText = ch.type === 'cctv' ? '央视' : '卫视';
            card.appendChild(nameSpan);
            card.appendChild(typeSpan);
            card.addEventListener('click', (e) => { e.stopPropagation(); switchChannel(ch); });
            fragment.appendChild(card);
        });
        channelsContainer.innerHTML = '';
        channelsContainer.appendChild(fragment);
    }

    function setActiveTab(category) {
        activeCategory = category;
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-category') === category) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        renderChannelsList();
    }

    function bindTabs() {
        document.querySelector('.tab-btn[data-category="cctv"]')?.addEventListener('click', () => setActiveTab('cctv'));
        document.querySelector('.tab-btn[data-category="satellite"]')?.addEventListener('click', () => setActiveTab('satellite'));
    }

    function initDefaultChannel() {
        if (cctvChannels.length) {
            const defaultChan = cctvChannels.find(c => c.name.includes('CCTV-1')) || cctvChannels[0];
            currentChannel = defaultChan;
            currentChannelNameSpan.innerText = defaultChan.name;
            const fullUrl = getFullUrl(defaultChan.url);
            videoPlayer.src = fullUrl;
            videoPlayer.load();
            videoPlayer.play().catch(e => console.log("自动播放失败，等待用户交互", e));
            renderChannelsList();
        }
    }

    // 全局点击尝试恢复自动播放（解决部分浏览器策略）
    document.body.addEventListener('click', () => {
        if (videoPlayer && videoPlayer.paused && videoPlayer.src) videoPlayer.play().catch(e=>{});
    });

    function init() {
        bindTabs();
        initDefaultChannel();
        setActiveTab('cctv');
    }
    init();
</script>
</body>
</html>
