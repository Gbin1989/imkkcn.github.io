    // ---------- 智能解析文本频道 ----------
    function parseM3UList(text) {
        const lines = text.split(/\r?\n/);
        let currentCategory = "未分类";
        const channelsMap = new Map(); // key: category|name, value: channel obj
        const categoryOrder = [];

        for (let line of lines) {
            line = line.trim();
            if (line === "") continue;
            // 分类标记行: 名称,#genre#
            if (line.includes("#genre#")) {
                const catName = line.split(",")[0].trim();
                if (catName && !categoryOrder.includes(catName)) {
                    categoryOrder.push(catName);
                }
                currentCategory = catName;
                continue;
            }
            // 普通频道行: 处理可能包含逗号的url, 取第一个逗号分割
            const firstCommaIdx = line.indexOf(',');
            if (firstCommaIdx === -1) continue;
            let rawName = line.substring(0, firstCommaIdx).trim();
            let url = line.substring(firstCommaIdx + 1).trim();
            if (!url || url === "") continue;
            // 处理特殊情况 "超级综艺,,http://..." 导致 rawName 后面带逗号空? 上面已经截取正确, 不需要额外操作
            let channelName = rawName;
            // 去重: 同分类下相同频道名只保留第一个有效url
            const mapKey = `${currentCategory}|${channelName}`;
            if (!channelsMap.has(mapKey)) {
                channelsMap.set(mapKey, {
                    name: channelName,
                    category: currentCategory,
                    url: url
                });
            }
        }
        const channels = Array.from(channelsMap.values());
        return { channels, categories: categoryOrder };
    }

    const { channels: allChannels, categories: categoryList } = parseM3UList(rawText);
    console.log(`加载成功,共 ${allChannels.length} 个频道,分类数: ${categoryList.length}`);

    // DOM 元素
    const videoPlayer = document.getElementById('liveVideo');
    const currentChannelNameSpan = document.getElementById('currentChannelName');
    const channelsContainer = document.getElementById('channelsContainer');
    const tabsContainer = document.getElementById('tabsContainer');
    const loadingToast = document.getElementById('loadingToast');
    
    let activeCategory = categoryList.length > 0 ? categoryList[0] : "央视频道";
    let currentChannel = null;
    let toastTimeout = null;

    // 分类短名映射 (用于卡片标签)
    function getShortCatName(catFull) {
        const map = {
            "央视频道": "央视", "卫视频道": "卫视", "江西频道": "江西", "央视精品频道": "精品",
            "卫视4K超频道": "4K超", "NewTV": "NewTV", "咪咕频道": "咪咕", "港澳频道": "港澳",
            "动漫频道": "动漫", "特色频道": "特色", "央视外语频道": "外语", "央视教育频道": "教育",
            "新华社频道": "新华社", "购物频道": "购物"
        };
        return map[catFull] || catFull.slice(0, 4);
    }

    function showLoadingToast(msg, autoHide = true) {
        if (loadingToast) {
            loadingToast.innerText = msg;
            loadingToast.style.opacity = '1';
            if (toastTimeout) clearTimeout(toastTimeout);
            if (autoHide) toastTimeout = setTimeout(() => { if (loadingToast) loadingToast.style.opacity = '0'; }, 1800);
        }
    }
    function hideLoadingToast() { if (loadingToast) loadingToast.style.opacity = '0'; if (toastTimeout) clearTimeout(toastTimeout); }

    // 核心：切换频道（并自动跳转分类tab）
    function switchChannel(channel) {
        if (!channel || !channel.url) return;
        if (currentChannel && currentChannel.name === channel.name && currentChannel.url === channel.url && videoPlayer.src === channel.url) return;
        
        showLoadingToast(`加载 ${channel.name} ...`);
        currentChannel = channel;
        currentChannelNameSpan.innerText = channel.name;
        
        // 自动切换tab到该频道所在分类
        if (activeCategory !== channel.category) {
            setActiveCategory(channel.category);
        }
        
        videoPlayer.pause();
        videoPlayer.src = '';
        videoPlayer.src = channel.url;
        videoPlayer.load();
        videoPlayer.play().catch(e => {
            console.warn("自动播放被阻止,需用户交互", e);
            showLoadingToast(`点击播放器即可播放 ${channel.name}`, true);
        });
        renderChannelsList(); // 刷新高亮
        
        videoPlayer.onerror = () => showLoadingToast(`频道 ${channel.name} 源可能失效,尝试切换`, true);
        videoPlayer.oncanplay = () => hideLoadingToast();
    }

    // 渲染当前分类的频道列表
    function renderChannelsList() {
        const channelsInCat = allChannels.filter(ch => ch.category === activeCategory);
        if (!channelsContainer) return;
        if (channelsInCat.length === 0) {
            channelsContainer.innerHTML = '<div class="empty-tip">📡 暂无频道数据</div>';
            return;
        }
        const fragment = document.createDocumentFragment();
        channelsInCat.forEach(ch => {
            const card = document.createElement('div');
            card.className = 'channel-card';
            if (currentChannel && currentChannel.name === ch.name && currentChannel.category === ch.category) {
                card.classList.add('active-channel');
            }
            const nameSpan = document.createElement('div');
            nameSpan.className = 'channel-name';
            nameSpan.innerText = ch.name;
            const typeSpan = document.createElement('div');
            typeSpan.className = 'channel-type';
            typeSpan.innerText = getShortCatName(ch.category);
            card.appendChild(nameSpan);
            card.appendChild(typeSpan);
            card.addEventListener('click', (e) => { e.stopPropagation(); switchChannel(ch); });
            fragment.appendChild(card);
        });
        channelsContainer.innerHTML = '';
        channelsContainer.appendChild(fragment);
    }

    // 设置激活分类 + 重绘tab + 重绘频道列表
    function setActiveCategory(category) {
        activeCategory = category;
        // 更新 tab 按钮样式
        document.querySelectorAll('.tab-btn').forEach(btn => {
            if (btn.getAttribute('data-cat') === category) btn.classList.add('active');
            else btn.classList.remove('active');
        });
        renderChannelsList();
    }

    // 动态构建顶部分类选项卡
    function buildTabs() {
        if (!tabsContainer) return;
        tabsContainer.innerHTML = '';
        categoryList.forEach(cat => {
            const btn = document.createElement('button');
            btn.className = 'tab-btn';
            if (cat === activeCategory) btn.classList.add('active');
            btn.setAttribute('data-cat', cat);
            btn.innerText = cat;
            btn.addEventListener('click', () => setActiveCategory(cat));
            tabsContainer.appendChild(btn);
        });
    }

    // 初始化默认频道 (第一个分类的第一个频道)
    function initDefaultChannel() {
        if (allChannels.length === 0) return;
        const firstCategory = categoryList[0];
        const firstChannel = allChannels.find(ch => ch.category === firstCategory);
        if (firstChannel) {
            currentChannel = firstChannel;
            currentChannelNameSpan.innerText = firstChannel.name;
            videoPlayer.src = firstChannel.url;
            videoPlayer.load();
            videoPlayer.play().catch(e => console.log("自动播放策略需交互"));
            renderChannelsList();
        }
    }

    // 全局辅助播放: 点击任何地方尝试恢复播放
    document.body.addEventListener('click', () => {
        if (videoPlayer && videoPlayer.paused && videoPlayer.src) {
            videoPlayer.play().catch(e=>{});
        }
    });

    function init() {
        buildTabs();
        initDefaultChannel();
        setActiveCategory(categoryList[0] || "央视频道");
    }
    init();
</script>
