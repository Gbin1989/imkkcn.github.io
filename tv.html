        // ---------- 智能解析文本频道 ----------
        function parseM3UList(text) {
            const lines = text.split(/\r?\n/);
            let currentCategory = "未分类";
            const channelsMap = new Map();
            const categoryOrder = [];

            for (let line of lines) {
                line = line.trim();
                if (line === "") continue;
                if (line.includes("#genre#")) {
                    const catName = line.split(",")[0].trim();
                    if (catName && !categoryOrder.includes(catName)) {
                        categoryOrder.push(catName);
                    }
                    currentCategory = catName;
                    continue;
                }
                const firstCommaIdx = line.indexOf(',');
                if (firstCommaIdx === -1) continue;
                let rawName = line.substring(0, firstCommaIdx).trim();
                let url = line.substring(firstCommaIdx + 1).trim();
                // 修复双逗号问题：去掉URL开头的逗号
                url = url.replace(/^,+/g, '').trim();
                if (!url || url === "") continue;
                let channelName = rawName;
                const mapKey = `${currentCategory}|${channelName}`;
                if (!channelsMap.has(mapKey)) {
                    channelsMap.set(mapKey, {
                        name: channelName,
                        category: currentCategory,
                        url: url
                    });
                }
            }
            const channels = Array.from(channelsMap.values());
            return { channels, categories: categoryOrder };
        }

        const { channels: allChannels, categories: categoryList } = parseM3UList(rawText);

                if (autoHide) {
                    toastTimeout = setTimeout(() => {

                    }, 2000);

            }

        function switchChannel(channel) {
            if (!channel || !channel.url) return;
            if (isSwitchingChannel) return;
            if (currentChannel &&
                currentChannel.name === channel.name &&
                currentChannel.url === channel.url &&
                videoPlayer.src === channel.url) {

                videoPlayer.load();
                const playPromise = videoPlayer.play();

                        isSwitchingChannel = false;
                    }).catch(e => {
                        console.warn("自动播放被阻止，需用户交互", e);
                        showLoadingToast(`📺 点击播放器即可播放 ${channel.name}`, true);
                        isSwitchingChannel = false;
                    });
                } else {
                    isSwitchingChannel = false;
                }
            }, 60);

            renderChannelsList();

            // 滚动当前频道卡片到可见区域
            setTimeout(() => {
                const activeCard = channelsContainer?.querySelector('.channel-card.active-channel');
                if (activeCard) {
                    activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
            }, 150);
        }

        // 视频错误处理
        videoPlayer.onerror = function() {
            if (currentChannel) {
                showLoadingToast(`⚠️ ${currentChannel.name} 源可能失效，请尝试切换其他频道`, true);
            }
            isSwitchingChannel = false;
        };
        videoPlayer.oncanplay = function() {
            hideLoadingToast();
            isSwitchingChannel = false;
        };
        videoPlayer.onwaiting = function() {
            if (currentChannel && videoPlayer.src) {
                showLoadingToast(`⏳ 缓冲中...`, true);
            }
        };

        // 渲染当前分类的频道列表
        function renderChannelsList() {
            const channelsInCat = allChannels.filter(ch => ch.category === activeCategory);
            if (!channelsContainer) return;
            if (channelsInCat.length === 0) {
                channelsContainer.innerHTML = '<div class="empty-tip">📡 暂无频道数据</div>';
                return;
            }
            const fragment = document.createDocumentFragment();
            channelsInCat.forEach(ch => {
                const card = document.createElement('div');
                card.className = 'channel-card';
                if (currentChannel &&
                    currentChannel.name === ch.name &&
                    currentChannel.category === ch.category) {
                    card.classList.add('active-channel');
                }
                const nameSpan = document.createElement('div');
                nameSpan.className = 'channel-name';
                nameSpan.innerText = ch.name;
                const typeSpan = document.createElement('div');
                typeSpan.className = 'channel-type';
                typeSpan.innerText = getShortCatName(ch.category);
                card.appendChild(nameSpan);
                card.appendChild(typeSpan);
                card.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (!isSwitchingChannel) {
                        switchChannel(ch);
                    }
                });
                // 触摸事件优化（防止双击缩放）
                card.addEventListener('touchstart', function(e) {
                    this.style.transition = 'transform 0.06s ease, background 0.06s ease';
                }, { passive: true });
                card.addEventListener('touchend', function(e) {
                    this.style.transition = 'all 0.18s ease';
                }, { passive: true });
                fragment.appendChild(card);
            });
            channelsContainer.innerHTML = '';
            channelsContainer.appendChild(fragment);
        }

        // 设置激活分类
        function setActiveCategory(category, skipScroll = false) {
            activeCategory = category;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                if (btn.getAttribute('data-cat') === category) {
                    btn.classList.add('active');
                    // 滚动tab到可见区域（移动端横向滚动）
                    if (!skipScroll && window.innerWidth < 769) {
                        btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                    }
                } else {
                    btn.classList.remove('active');
                }
            });
            renderChannelsList();
            // 滚动频道列表到顶部
            if (channelsContainer) {
                channelsContainer.scrollTop = 0;
            }
        }

        // 动态构建顶部分类选项卡
        function buildTabs() {
            if (!tabsContainer) return;
            tabsContainer.innerHTML = '';
            categoryList.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'tab-btn';
                if (cat === activeCategory) btn.classList.add('active');
                btn.setAttribute('data-cat', cat);
                btn.innerText = cat;
                btn.addEventListener('click', () => {
                    if (activeCategory !== cat) {
                        setActiveCategory(cat);
                    }
                });
                tabsContainer.appendChild(btn);
            });
        }

        // 初始化默认频道
        function initDefaultChannel() {
            if (allChannels.length === 0) return;
            const firstCategory = categoryList[0] || "央视频道";
            const firstChannel = allChannels.find(ch => ch.category === firstCategory);
            if (firstChannel) {
                currentChannel = firstChannel;
                currentChannelNameSpan.innerText = firstChannel.name;
                videoPlayer.src = firstChannel.url;
                videoPlayer.load();
                const playPromise = videoPlayer.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => {
                        console.log("自动播放策略需用户交互，点击播放器即可");
                        showLoadingToast("📺 点击播放器开始播放", true);
                    });
                }
                renderChannelsList();
            }
        }

        // 全局辅助：点击视频区域尝试恢复播放
        const videoWrapper = document.querySelector('.video-wrapper');
        if (videoWrapper) {
            videoWrapper.addEventListener('click', (e) => {
                if (videoPlayer && videoPlayer.paused && videoPlayer.src && !isSwitchingChannel) {
                    videoPlayer.play().catch(e => {});
                }
            });
        }

        // 监听窗口大小变化，重新渲染频道列表以适配列数
        let resizeDebounce = null;
        window.addEventListener('resize', () => {
            if (resizeDebounce) clearTimeout(resizeDebounce);
            resizeDebounce = setTimeout(() => {
                renderChannelsList();
            }, 250);
        });

        function init() {
            buildTabs();
            initDefaultChannel();
            setActiveCategory(categoryList[0] || "央视频道", true);
            console.log('🚀 KuDog 云视在线直播已就绪');
        }
        init();
    </script>
</body>
</html>
